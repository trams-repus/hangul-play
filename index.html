<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f1830" />
    <meta name="color-scheme" content="dark" />
    <title>한글대작전</title>
    <!-- 앱 아이콘을 줄인 것 (없으면 브라우저가 favicon.ico를 찾다가 404 오류를 남긴다) -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="module" crossorigin src="./assets/index-BVesjSnK.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BQfXug94.css">
  </head>
  <body>
    <div id="game"></div>
    <div id="app">
      <header id="topbar" hidden>
        <button id="btn-pause" class="icon-btn" aria-label="일시정지"></button>
        <div class="dots" id="foe-dots" role="img" aria-label="남은 적"></div>
        <div id="combo" hidden><b>0</b><span>콤보</span></div>
      </header>
      <main id="battle"></main>
      <section id="cockpit" hidden>
        <div class="receiver" id="receiver">
          <button id="btn-listen" class="listen-btn" aria-label="다시 듣기">
            <span class="spk"></span>
            <span class="wave"><i></i><i></i><i></i><i></i><i></i></span>
          </button>
          <!-- 들은 단어의 뜻 그림 (글자 없음). 누르면 다시 듣기 -->
          <button id="word-pic" class="word-pic empty" aria-label="단어 그림: 다시 듣기"></button>
          <div class="combo-gauge" id="combo-gauge"><div class="fill"></div></div>
          <button id="btn-help" class="round-btn help" aria-label="정답 자모 보기"></button>
        </div>
        <div id="frames" class="frames"></div>
        <div id="zone" class="zone"></div>
        <!-- 필살기: 에너지가 가득 차면 끌어 넣기 대신 손가락으로 따라 쓴다 -->
        <div id="writepad" class="writepad" hidden></div>
      </section>
    </div>
    <!-- 전투 그림(캔버스) 위에 겹치는 표시: 위치는 main.ts가 #battle 영역에 맞춘다 -->
    <div id="hud">
      <div class="status foe-status" id="foe-status" hidden>
        <span class="st-icon" id="foe-icon"></span>
        <div class="bar"><div class="fill" id="foe-fill"></div></div>
      </div>
      <div class="status robot-status" id="robot-status" hidden>
        <span class="st-icon" id="robot-icon"></span>
        <div class="bars">
          <div class="bar"><div class="fill" id="robot-fill"></div></div>
          <!-- 필살기 에너지: 단어를 완성할 때마다 찬다 -->
          <div class="energy" id="energy" role="img" aria-label="필살기 에너지"></div>
        </div>
      </div>
      <div id="subtitle" hidden><span></span></div>
      <div id="stage-banner" hidden><b></b><span></span></div>
    </div>
    <div id="hand" hidden></div>
    <div id="overlay" hidden></div>
    <div id="boot">한글대작전 준비 중…</div>
    <script>
      // 게임 코드(모듈)를 읽지 못하는 아주 오래된 브라우저·WebView: '준비 중'에 멈춰 있지 않고 업데이트를 안내한다.
      // 모듈 문법 오류(SyntaxError)면 바로, 그 밖에는 25초 뒤에도 시작 화면이 없을 때. 게임이 시작되면 #boot가 없어져 아무 일도 하지 않는다.
      (function () {
        function fail() {
          var b = document.getElementById('boot');
          if (b && b.textContent.indexOf('시작하지 못했습니다') < 0) b.textContent = '게임을 시작하지 못했습니다. 브라우저(앱이면 Android System WebView)를 최신으로 업데이트한 뒤 다시 열어 주세요.';
        }
        window.addEventListener('error', function (e) {
          if (e && e.error && e.error.name === 'SyntaxError') fail();
        });
        setTimeout(fail, 25000);
      })();
    </script>
    <script nomodule>
      document.getElementById('boot').textContent = '이 브라우저에서는 게임을 열 수 없습니다. 최신 Chrome 등으로 열어 주세요.';
    </script>
    <!-- 휴대폰을 가로로 눕히면 조립판이 화면 밖으로 나가므로 세로로 돌려 달라고 한다 (앱은 세로로 고정, 웹판·분할 화면용) -->
    <!-- 글을 아직 못 읽는 아이도 알아보게, 눕힌 휴대폰이 세로로 서는 그림을 함께 보인다 -->
    <div id="rotate-hint">
      <svg class="rotate-pic" viewBox="0 0 120 120" aria-hidden="true">
        <g class="phone">
          <rect x="38" y="23" width="44" height="78" rx="9" fill="#1b2748" stroke="currentColor" stroke-width="6" />
          <circle cx="60" cy="90" r="4" fill="currentColor" />
        </g>
        <path d="M9.3 43.5 A54 54 0 0 1 110.7 43.5" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
        <path d="M113.6 32.9 L110.7 43.5 L101.7 37.2" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <p>휴대폰을 세로로 세워 주세요</p>
    </div>
  </body>
</html>
